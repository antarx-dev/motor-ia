button:disabled{
  opacity:.55;
  cursor:not-allowed
}

input,textarea,select{
  width:100%;
  padding:13px 14px;
  background:var(--field);
  border:1px solid var(--field-line);
  border-radius:11px;
  color:var(--text);
  font-size:14px;
  outline:none
}

input:focus,textarea:focus,select:focus{
  border-color:#81936f
}

textarea{
  min-height:120px;
  resize:vertical
}

::-moz-selection{
  background:#526347;
  color:#fff
}

::selection{
  background:#526347;
  color:#fff
}

@media (min-width: 640px){
  .sm\:col-span-3{
    grid-column: span 3 / span 3;
  }

  .sm\:block{
    display: block;
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-\[minmax\(0\2c 1fr\)_200px\]{
    grid-template-columns: minmax(0,1fr) 200px;
  }

  .sm\:px-\[14px\]{
    padding-left: 14px;
    padding-right: 14px;
  }
}
