<html lang="pt-BR"><style>* { -webkit-text-size-adjust: 95.33333333333333% !important; }</style><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a08">
<title>MotorIA — Estúdio de Afiliados</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#080a08;--panel:#111510;--panel2:#171d15;--line:#2a3426;--moss:#252d20;--sage:#aab59a;--text:#eef0e9;--muted:#a3aa9b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;line-height:1.5}
button,input,textarea,select{font:inherit}
header{padding:25px 18px 20px;background:linear-gradient(135deg,#141b12,#080a08 72%);border-bottom:1px solid var(--line)}
.header-inner,main{max-width:980px;margin:auto}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#526347,#252d20);display:grid;place-items:center;font-size:21px}
.brand-name{font-weight:800;font-size:23px}
.tagline{color:var(--muted);font-size:12px}
.header-note{margin:22px 0 0;font:700 clamp(22px,5vw,32px)/1.2 Manrope;max-width:620px}
.header-note span{color:var(--sage)}
main{padding:18px 14px 50px}
nav{display:flex;gap:8px;overflow-x:auto;padding:3px 1px 14px;margin-bottom:8px;scrollbar-width:none}
.nav-btn{white-space:nowrap;background:transparent;border:1px solid var(--line);color:var(--muted);padding:10px 13px;border-radius:999px;font-size:12px;font-weight:700}
.nav-btn.active{background:var(--moss);border-color:#526247;color:white}
section.panel{background:var(--panel);border:1px solid var(--line);padding:19px;border-radius:18px;margin-bottom:16px}
h2{font-size:19px;margin:0 0 7px}
p{margin:7px 0;color:#d5d9cf}
.muted,.small{color:var(--muted);font-size:12px}
label{display:block;font-size:12px;font-weight:600;color:#c5cdbd;margin:13px 0 6px}
input,textarea,select{width:100%;padding:13px 14px;background:#0c100b;border:1px solid #35412f;border-radius:11px;color:var(--text);font-size:14px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#81936f}
textarea{min-height:100px;resize:vertical}
button{cursor:pointer}
.btn{border:1px solid #526247;background:linear-gradient(135deg,#45543a,#293324);color:white;padding:12px 16px;border-radius:11px;font-weight:700;font-size:13px;margin:9px 5px 0 0}
.btn.secondary{background:#171e15;border-color:#394634}
.btn.danger{background:#241614;border-color:#5b302c;color:#e5b4ae}
.btn:disabled{opacity:.55;cursor:not-allowed}
.notice{background:#1b2118;border:1px solid #46533d;color:#cbd4c1;padding:13px;border-radius:12px;font-size:12px;line-height:1.6;margin:13px 0}
.card{background:#151b13;border:1px solid var(--line);padding:13px;border-radius:14px;margin:11px 0}
.card img{width:100%;max-height:190px;object-fit:contain;border-radius:10px;background:#0b0e0a}
.result{white-space:pre-wrap;line-height:1.7;background:#0b0f0a;border:1px solid #303b2b;padding:15px;border-radius:12px;margin-top:12px;font-size:13px;overflow-wrap:anywhere}
.hidden{display:none!important}
.video-layout{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:18px;align-items:start}
.preview-wrap{display:flex;justify-content:center;background:#0b0e0a;border:1px solid var(--line);border-radius:14px;padding:10px}
.preview{width:100%;max-width:180px;aspect-ratio:9/16;border:1px dashed #69785c;border-radius:11px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);background:#171d15;padding:10px;font-size:12px}
.preview img{width:100%;height:100%;object-fit:contain}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
footer{text-align:center;color:#788071;font-size:11px;padding:20px}
video{display:block}
#downloadVideo{display:inline-block;text-decoration:none;margin-top:10px}
@media(max-width:620px){main{padding:14px 12px 40px}.video-layout{grid-template-columns:1fr}.preview{max-width:160px}.panel{padding:16px!important}}
.clips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.clip{background:#151b13;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px}
.clip video{width:100%;aspect-ratio:auto;margin:8px 0 4px;border-radius:8px;background:transparent}
.clip a{color:var(--sage)}
</style>
</head>
<body>
<div id="motoria-error" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#7a1f1f;color:#fff;padding:12px 14px;font:600 13px Inter,Arial,sans-serif"></div>
<script>
window.addEventListener('error',function(e){try{var b=document.getElementById('motoria-error');if(b){b.style.display='block';b.textContent='Ops, algo falhou, mas a tela continua aqui: '+(e.message||'erro desconhecido')+' — recarregue a página se precisar.';}}catch(_){}});
window.addEventListener('unhandledrejection',function(e){try{var b=document.getElementById('motoria-error');if(b){b.style.display='block';b.textContent='Falha na geração: '+((e.reason&&e.reason.message)||e.reason||'erro desconhecido')+' — tente outro provedor abaixo.';}}catch(_){}});
</script></body></html>
